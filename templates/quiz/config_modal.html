<!-- Quiz Configuration Modal -->
<div class="modal fade" id="quizConfigModal" tabindex="-1" aria-labelledby="quizConfigModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header border-bottom bg-light px-4 py-3 rounded-top-4">
                <div class="d-flex align-items-center gap-2">
                    <div class="stat-icon icon-teal shadow-sm" style="width: 40px; height: 40px; font-size: 1.2rem;">
                        <i class="bi bi-sliders"></i>
                    </div>
                    <div>
                        <h5 class="modal-title fw-bold text-dark mb-0" id="quizConfigModalLabel">Configure Your Practice Session</h5>
                        <small class="text-secondary" id="configModalSubtitle">Select questions, time limits, and difficulty.</small>
                    </div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <form id="quizConfigForm" method="GET" action="{{ url_for('quiz_view') }}">
                <input type="hidden" name="path" id="configPathInput" value="college">
                <input type="hidden" name="subject" id="configSubjectInput" value="Python Programming">
                <input type="hidden" name="exam" id="configExamInput" value="">

                <div class="modal-body p-4">
                    <!-- Session Header Info -->
                    <div class="p-3 bg-light rounded-3 border mb-4 d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <div>
                            <span class="badge bg-teal text-white me-2 px-2 py-1" id="configBadgePath">College Track</span>
                            <strong class="text-dark fs-6" id="configDisplaySubject">Python Programming</strong>
                            <span class="badge bg-secondary ms-1 d-none" id="configBadgeExam"></span>
                        </div>
                        <div class="small text-secondary">
                            <i class="bi bi-collection-fill text-teal me-1"></i>
                            <span id="configAvailableCountText">Checking question bank...</span>
                        </div>
                    </div>

                    <!-- 1. Number of Questions -->
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-dark d-block mb-2">
                            <i class="bi bi-list-ol text-primary me-1"></i> Number of Questions
                        </label>
                        <div class="row g-2 mb-2">
                            <div class="col-6 col-sm-3">
                                <input type="radio" class="btn-check config-count-radio" name="count_preset" id="count_10" value="10" checked>
                                <label class="btn btn-outline-secondary w-100 py-2 d-flex flex-column align-items-center rounded-3" for="count_10">
                                    <span class="fw-bold">10 MCQs</span>
                                    <small class="text-muted" style="font-size: 0.75rem;">Quick Drill</small>
                                </label>
                            </div>
                            <div class="col-6 col-sm-3">
                                <input type="radio" class="btn-check config-count-radio" name="count_preset" id="count_25" value="25">
                                <label class="btn btn-outline-secondary w-100 py-2 d-flex flex-column align-items-center rounded-3" for="count_25">
                                    <span class="fw-bold">25 MCQs</span>
                                    <small class="text-muted" style="font-size: 0.75rem;">Standard Practice</small>
                                </label>
                            </div>
                            <div class="col-6 col-sm-3">
                                <input type="radio" class="btn-check config-count-radio" name="count_preset" id="count_50" value="50">
                                <label class="btn btn-outline-secondary w-100 py-2 d-flex flex-column align-items-center rounded-3" for="count_50">
                                    <span class="fw-bold">50 MCQs</span>
                                    <small class="text-muted" style="font-size: 0.75rem;">Half Mock</small>
                                </label>
                            </div>
                            <div class="col-6 col-sm-3">
                                <input type="radio" class="btn-check config-count-radio" name="count_preset" id="count_100" value="100">
                                <label class="btn btn-outline-secondary w-100 py-2 d-flex flex-column align-items-center rounded-3" for="count_100">
                                    <span class="fw-bold">100 MCQs</span>
                                    <small class="text-muted" style="font-size: 0.75rem;">Full Mock</small>
                                </label>
                            </div>
                        </div>

                        <div class="text-center mb-2">
                            <input type="radio" class="btn-check config-count-radio" name="count_preset" id="count_custom" value="custom">
                            <label class="btn btn-sm btn-outline-teal px-3 py-1 rounded-pill" for="count_custom">
                                <i class="bi bi-pencil-square me-1"></i> Custom Count (3 - 100)
                            </label>
                        </div>

                        <div id="customCountWrapper" class="mt-2 d-none">
                            <div class="input-group mx-auto" style="max-width: 280px;">
                                <span class="input-group-text bg-light">Count:</span>
                                <input type="number" class="form-control" id="customCountInput" name="count" value="10" min="3" max="100">
                                <span class="input-group-text bg-light">questions</span>
                            </div>
                            <small class="text-muted d-block text-center mt-1">Select any count between 3 and 100 questions.</small>
                        </div>
                    </div>

                    <!-- 2. Time Limit -->
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-dark d-block mb-2">
                            <i class="bi bi-clock-history text-danger me-1"></i> Total Time Limit
                        </label>
                        <div class="row g-2 mb-2">
                            <div class="col-6 col-sm-3">
                                <input type="radio" class="btn-check config-time-radio" name="time_preset" id="time_0" value="0">
                                <label class="btn btn-outline-secondary w-100 py-2 d-flex flex-column align-items-center rounded-3" for="time_0">
                                    <span class="fw-bold">Untimed</span>
                                    <small class="text-muted" style="font-size: 0.75rem;">Self-Paced</small>
                                </label>
                            </div>
                            <div class="col-6 col-sm-3">
                                <input type="radio" class="btn-check config-time-radio" name="time_preset" id="time_15" value="15" checked>
                                <label class="btn btn-outline-secondary w-100 py-2 d-flex flex-column align-items-center rounded-3" for="time_15">
                                    <span class="fw-bold">15 Mins</span>
                                    <small class="text-muted" style="font-size: 0.75rem;">Fast Sprint</small>
                                </label>
                            </div>
                            <div class="col-6 col-sm-3">
                                <input type="radio" class="btn-check config-time-radio" name="time_preset" id="time_30" value="30">
                                <label class="btn btn-outline-secondary w-100 py-2 d-flex flex-column align-items-center rounded-3" for="time_30">
                                    <span class="fw-bold">30 Mins</span>
                                    <small class="text-muted" style="font-size: 0.75rem;">Standard Mock</small>
                                </label>
                            </div>
                            <div class="col-6 col-sm-3">
                                <input type="radio" class="btn-check config-time-radio" name="time_preset" id="time_custom" value="custom">
                                <label class="btn btn-outline-secondary w-100 py-2 d-flex flex-column align-items-center rounded-3" for="time_custom">
                                    <span class="fw-bold">Custom</span>
                                    <small class="text-muted" style="font-size: 0.75rem;">Set Minutes</small>
                                </label>
                            </div>
                        </div>

                        <div id="customTimeWrapper" class="mt-2 d-none">
                            <div class="input-group mx-auto" style="max-width: 280px;">
                                <span class="input-group-text bg-light">Duration:</span>
                                <input type="number" class="form-control" id="customTimeInput" name="time_limit" value="15" min="0" max="180">
                                <span class="input-group-text bg-light">minutes</span>
                            </div>
                            <small class="text-muted d-block text-center mt-1">Enter 0 for untimed, or between 1 and 180 minutes.</small>
                        </div>
                    </div>

                    <!-- 3. Difficulty Level -->
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-dark d-block mb-2">
                            <i class="bi bi-bar-chart-steps text-teal me-1"></i> Difficulty Level
                        </label>
                        <div class="row g-2">
                            <div class="col-6 col-sm-3">
                                <input type="radio" class="btn-check config-diff-radio" name="difficulty" id="diff_all" value="All" checked>
                                <label class="btn btn-outline-secondary w-100 py-2 text-center rounded-3 fw-semibold small" for="diff_all">
                                    Mixed (All)
                                </label>
                            </div>
                            <div class="col-6 col-sm-3">
                                <input type="radio" class="btn-check config-diff-radio" name="difficulty" id="diff_easy" value="Easy">
                                <label class="btn btn-outline-secondary w-100 py-2 text-center rounded-3 fw-semibold small" for="diff_easy">
                                    Easy
                                </label>
                            </div>
                            <div class="col-6 col-sm-3">
                                <input type="radio" class="btn-check config-diff-radio" name="difficulty" id="diff_medium" value="Medium">
                                <label class="btn btn-outline-secondary w-100 py-2 text-center rounded-3 fw-semibold small" for="diff_medium">
                                    Medium
                                </label>
                            </div>
                            <div class="col-6 col-sm-3">
                                <input type="radio" class="btn-check config-diff-radio" name="difficulty" id="diff_hard" value="Hard">
                                <label class="btn btn-outline-secondary w-100 py-2 text-center rounded-3 fw-semibold small" for="diff_hard">
                                    Hard
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer border-top px-4 py-3 bg-light rounded-bottom-4 d-flex justify-content-between align-items-center">
                    <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-teal px-5 py-2 fw-bold text-white shadow-sm" id="btnLaunchQuiz">
                        <i class="bi bi-play-circle-fill me-1"></i> Start Customized Quiz
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
