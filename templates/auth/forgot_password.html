{% extends "base.html" %}

{% block title %}Reset Password - EduMentor AI{% endblock %}

{% block extra_head %}
<style>
    .auth-page-wrapper {
        min-height: calc(100vh - 160px);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        padding: 2.5rem 1rem;
        background: radial-gradient(circle at 15% 20%, rgba(13, 148, 136, 0.08) 0%, transparent 45%),
                    radial-gradient(circle at 85% 80%, rgba(37, 99, 235, 0.08) 0%, transparent 45%);
    }

    .auth-card-container {
        width: 100%;
        max-width: 480px;
        position: relative;
        z-index: 2;
    }

    .auth-card {
        background: #ffffff;
        border: 1px solid rgba(226, 232, 240, 0.9);
        border-radius: 1.5rem;
        box-shadow: 0 20px 45px -12px rgba(15, 23, 42, 0.12);
        overflow: hidden;
    }

    .auth-header-gradient {
        background: linear-gradient(135deg, #091e3a 0%, #1e293b 60%, #0d9488 100%);
        padding: 2.5rem 2rem 2rem;
        text-align: center;
        color: #ffffff;
    }

    .auth-logo-badge {
        width: 60px;
        height: 60px;
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(8px);
        border: 1.5px solid rgba(255, 255, 255, 0.25);
        border-radius: 1.25rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1rem;
        color: #2dd4bf;
        font-size: 1.8rem;
    }

    .auth-body {
        padding: 2.25rem 2rem 2rem;
    }

    .input-icon-prefix {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: #64748b;
        font-size: 1.1rem;
        z-index: 4;
        pointer-events: none;
    }

    .form-control-with-icon {
        padding-left: 2.75rem !important;
        border-radius: 0.75rem;
        border: 1.5px solid #cbd5e1;
        font-size: 0.95rem;
    }

    .form-control-with-icon:focus {
        border-color: #0d9488;
        box-shadow: 0 0 0 0.25rem rgba(13, 148, 136, 0.15);
    }

    .btn-auth-submit {
        background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
        color: #ffffff;
        border: none;
        border-radius: 0.75rem;
        padding: 0.85rem 1.5rem;
        font-weight: 700;
        box-shadow: 0 4px 14px rgba(13, 148, 136, 0.3);
    }

    .btn-auth-submit:hover {
        background: linear-gradient(135deg, #0f766e 0%, #115e59 100%);
        color: #ffffff;
    }

    [data-bs-theme="dark"] .auth-card {
        background: #1e293b !important;
        border-color: #334155 !important;
    }

    [data-bs-theme="dark"] .form-control-with-icon {
        background-color: #0f172a;
        border-color: #334155;
        color: #f8fafc;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
    <div class="auth-card-container">
        <div class="auth-card">
            <!-- Header Banner -->
            <div class="auth-header-gradient">
                <div class="auth-logo-badge">
                    <i class="bi bi-key-fill"></i>
                </div>
                <h3 class="fw-bold mb-1 tracking-tight text-white">Password Recovery</h3>
                <p class="small text-white-50 mb-0">Verify your student account and choose a new password</p>
            </div>

            <div class="auth-body">
                <form method="POST" action="{{ url_for('forgot_password') }}" id="recoveryForm">
                    <div class="mb-3">
                        <label for="username_or_email" class="form-label fw-semibold small text-dark">Username or Registered Email</label>
                        <div class="position-relative">
                            <i class="bi bi-person-check-fill input-icon-prefix"></i>
                            <input type="text" 
                                   class="form-control form-control-with-icon py-2.5" 
                                   id="username_or_email" 
                                   name="username_or_email" 
                                   value="{{ username_or_email or '' }}" 
                                   placeholder="Enter your username or email" 
                                   required 
                                   autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="new_password" class="form-label fw-semibold small text-dark">New Password</label>
                        <div class="input-group">
                            <div class="position-relative flex-grow-1">
                                <i class="bi bi-shield-lock-fill input-icon-prefix"></i>
                                <input type="password" 
                                       class="form-control form-control-with-icon py-2.5 rounded-end-0" 
                                       id="new_password" 
                                       name="new_password" 
                                       placeholder="At least 6 characters" 
                                       required 
                                       minlength="6">
                            </div>
                            <button class="btn btn-outline-secondary toggle-password-btn px-3 border-start-0 rounded-end-3" 
                                    type="button" 
                                    data-target="new_password" 
                                    title="Show/Hide Password" 
                                    aria-label="Toggle password visibility">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="confirm_password" class="form-label fw-semibold small text-dark">Confirm New Password</label>
                        <div class="input-group">
                            <div class="position-relative flex-grow-1">
                                <i class="bi bi-shield-check input-icon-prefix"></i>
                                <input type="password" 
                                       class="form-control form-control-with-icon py-2.5 rounded-end-0" 
                                       id="confirm_password" 
                                       name="confirm_password" 
                                       placeholder="Re-type new password" 
                                       required 
                                       minlength="6">
                            </div>
                            <button class="btn btn-outline-secondary toggle-password-btn px-3 border-start-0 rounded-end-3" 
                                    type="button" 
                                    data-target="confirm_password" 
                                    title="Show/Hide Password" 
                                    aria-label="Toggle password visibility">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-auth-submit w-100 mb-3 d-flex align-items-center justify-content-center gap-2">
                        <i class="bi bi-check2-circle"></i>
                        <span>Reset & Save New Password</span>
                    </button>

                    <div class="text-center pt-3 border-top">
                        <a href="{{ url_for('login') }}" class="small fw-semibold text-secondary text-decoration-none">
                            <i class="bi bi-arrow-left me-1"></i> Back to Sign In
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
